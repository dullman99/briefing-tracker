<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📡 브리핑 컨텐츠 트래커</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0D1117; font-family: 'Noto Sans KR', -apple-system, sans-serif; color: #E6EDF3; min-height: 100vh; padding: 20px 24px 40px; }
::-webkit-scrollbar { height: 4px; width: 4px; }
::-webkit-scrollbar-thumb { background: #374151; border-radius: 2px; }
h1 { font-size: 18px; font-weight: 700; color: #F0F6FF; }
.subtitle { font-size: 12px; color: #6B7A99; margin: 4px 0 16px; }
.stats { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.stat { background: #161B2E; padding: 6px 14px; border-radius: 8px; display: flex; align-items: baseline; gap: 6px; border: 1px solid #2A3050; }
.stat-val { font-size: 18px; font-weight: 700; }
.stat-label { font-size: 11px; color: #6B7A99; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; }
.filter-btn { font-size: 11px; padding: 3px 10px; border-radius: 12px; cursor: pointer; border: 1px solid #2A3050; background: transparent; color: #6B7A99; }
.filter-btn.active { border-color: #4F6EF7; background: #1E2A5E; color: #93AAFF; }
.refresh-btn { background: #161B2E; border: 1px solid #2A3050; color: #6B7A99; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 12px; }
.section { margin-bottom: 28px; }
.section-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.section-title { font-size: 14px; font-weight: 700; }
.section-count { font-size: 11px; color: #9CA3AF; background: #1F2937; padding: 2px 8px; border-radius: 10px; border: 1px solid #374151; }
.scroll-btn { background: #1F2937; border: 1px solid #374151; color: #9CA3AF; width: 26px; height: 26px; border-radius: 6px; cursor: pointer; font-size: 11px; }
.spacer { flex: 1; }
.cards { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; scrollbar-color: #374151 transparent; }
.card { width: 252px; flex-shrink: 0; background: #1A1F2E; border-radius: 8px; padding: 12px 14px; border: 1px solid #252D44; display: flex; flex-direction: column; gap: 8px; transition: opacity 0.2s; }
.card.done { background: #0F1A0F; border-color: #1A3A1A; opacity: 0.65; }
.card-title { font-size: 13px; font-weight: 600; color: #EEF0FF; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-meta { font-size: 11px; color: #6B7A99; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-tags { display: flex; gap: 4px; flex-wrap: nowrap; overflow-x: auto; }
.tag { font-size: 10px; padding: 2px 7px; border-radius: 4px; white-space: nowrap; }
.card-footer { display: flex; align-items: center; justify-content: space-between; }
.card-footer label { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 11px; color: #6B7A99; }
.card-footer a { font-size: 11px; color: #4F6EF7; text-decoration: none; }
.loading { text-align: center; padding: 80px; color: #4B5563; }
.error-box { background: #1A0A0A; border: 1px solid #5A1A1A; border-radius: 8px; padding: 20px; color: #F87171; }
.error-btn { margin-top: 12px; background: #2A1010; border: 1px solid #5A1A1A; color: #F87171; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 12px; }
.empty { color: #4B5563; font-size: 13px; padding: 20px; }
.sync-time { font-size: 11px; color: #4B5563; margin-bottom: 14px; }
.token-screen { max-width: 420px; margin: 60px auto; }
.token-screen h2 { font-size: 16px; color: #F0F6FF; margin-bottom: 8px; }
.token-screen p { font-size: 12px; color: #6B7A99; margin-bottom: 20px; line-height: 1.6; }
.token-input { width: 100%; background: #161B2E; border: 1px solid #2A3050; color: #E6EDF3; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 10px; }
.token-btn { width: 100%; background: #1E2A5E; border: 1px solid #4F6EF7; color: #93AAFF; padding: 10px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; }
.reset-link { font-size: 11px; color: #4B5563; background: none; border: none; cursor: pointer; margin-top: 16px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
const STORAGE_KEY = "notion_token";
const PROJECT_COLORS = {
  "CounselFlow 플랫폼": { bg:"#1E3A5F", text:"#60A5FA", border:"#2563EB" },
  "TeachFlow": { bg:"#064E3B", text:"#34D399", border:"#059669" },
  "옵시디언(상담DB)": { bg:"#2E1065", text:"#A78BFA", border:"#7C3AED" },
  "상담자비스 CounselFlow": { bg:"#431407", text:"#FB923C", border:"#EA580C" },
  "페이블5 유산": { bg:"#500724", text:"#F472B6", border:"#DB2777" },
  "클로드 활용(코드·코워크)": { bg:"#1E1B4B", text:"#818CF8", border:"#4F46E5" },
  "작은학교 프로젝트": { bg:"#292524", text:"#D4A26A", border:"#92400E" },
  "스마트교육 연구대회": { bg:"#1F2937", text:"#9CA3AF", border:"#4B5563" },
  "유튜브 컨텐츠 검색앱": { bg:"#422006", text:"#FBBF24", border:"#D97706" },
  "워크플로우 자동화": { bg:"#450A0A", text:"#F87171", border:"#DC2626" },
  "수익화 분석 시스템": { bg:"#172554", text:"#93C5FD", border:"#1D4ED8" },
  "상담용어집": { bg:"#022C22", text:"#6EE7B7", border:"#047857" },
};

let allItems = [];
let currentFilter = "전체";

const getToken = () => localStorage.getItem(STORAGE_KEY);
const saveToken = t => localStorage.setItem(STORAGE_KEY, t.trim());
const clearToken = () => { localStorage.removeItem(STORAGE_KEY); renderTokenScreen(); };

function renderTokenScreen() {
  document.getElementById("app").innerHTML = `
    <div class="token-screen">
      <div style="font-size:28px;margin-bottom:12px">📡</div>
      <h2>브리핑 컨텐츠 트래커</h2>
      <p>Notion 개인 액세스 토큰을 입력하세요.<br>
      토큰은 이 기기에만 저장되며 외부로 전송되지 않습니다.<br>
      <a href="https://app.notion.com/developers" target="_blank" style="color:#4F6EF7">notion.com/developers</a> → 개인 액세스 토큰</p>
      <input class="token-input" id="tokenInput" type="password" placeholder="ntn_xxxxxxxxxxxx" />
      <button class="token-btn" onclick="handleTokenSubmit()">연결하기</button>
      <br><button class="reset-link" onclick="clearToken()">토큰 초기화</button>
    </div>`;
}

function handleTokenSubmit() {
  const val = document.getElementById("tokenInput").value.trim();
  if (!val) return;
  saveToken(val);
  fetchData();
}

async function fetchData() {
  const token = getToken();
  if (!token) { renderTokenScreen(); return; }
  document.getElementById("app").innerHTML = `<div class="loading"><div style="font-size:36px;margin-bottom:16px">⏳</div><div>Notion에서 데이터 불러오는 중...</div></div>`;
  try {
    const res = await fetch("/api/notion", {
      method: "POST",
      headers: {
        "Authorization": `Bearer ${token}`,
        "Content-Type": "application/json"
      }
    });
    if (!res.ok) {
      const err = await res.json();
      if (res.status === 401) { clearToken(); return; }
      throw new Error(err.error || `HTTP ${res.status}`);
    }
    const data = await res.json();
    allItems = data.items.sort((a,b) => b.date.localeCompare(a.date));
    renderDashboard();
  } catch(e) {
    document.getElementById("app").innerHTML = `
      <div class="error-box">
        <div style="font-weight:700;margin-bottom:8px">⚠ 오류</div>
        <div style="font-size:12px;margin-bottom:12px">${e.message}</div>
        <button class="error-btn" onclick="fetchData()">다시 시도</button>
        <button class="error-btn" style="margin-left:8px" onclick="clearToken()">토큰 재입력</button>
      </div>`;
  }
}

function renderDashboard() {
  const imm = allItems.filter(i => i.category === "즉각반영");
  const ref = allItems.filter(i => i.category === "참고용");
  const done = allItems.filter(i => i.done).length;
  const dateGroups = [...new Set(allItems.map(i => i.date.slice(0,10)).filter(Boolean))].sort().reverse();
  const statsHtml = [
    {label:"전체",val:allItems.length,color:"#6B7A99"},
    {label:"즉각반영",val:imm.length,color:"#EF4444"},
    {label:"참고용",val:ref.length,color:"#F59E0B"},
    {label:"반영완료",val:done,color:"#10B981"},
  ].map(s=>`<div class="stat" style="border-color:${s.color}30"><span class="stat-val" style="color:${s.color}">${s.val}</span><span class="stat-label">${s.label}</span></div>`).join("")
  + `<button class="refresh-btn" onclick="fetchData()">↻ 새로고침</button>`;
  const filtersHtml = ["전체","즉각반영","참고용",...dateGroups].map(f=>
    `<button class="filter-btn ${currentFilter===f?'active':''}" onclick="setFilter('${f}')">${f}</button>`
  ).join("");
  document.getElementById("app").innerHTML = `
    <div style="margin-bottom:20px">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">
        <span style="font-size:20px">📡</span><h1>브리핑 컨텐츠 트래커</h1>
        <div style="flex:1"></div>
        <button class="reset-link" onclick="clearToken()">토큰 변경</button>
      </div>
      <p class="subtitle">7/11 ~ 7/30 AI 브리핑 전체 · 프로젝트 반영 관리</p>
      <div class="stats">${statsHtml}</div>
      <div class="sync-time">마지막 동기화: ${new Date().toLocaleString("ko-KR")}</div>
      <div class="filters">${filtersHtml}</div>
    </div>
    <div id="sections"></div>`;
  renderSections();
}

function setFilter(f) { currentFilter = f; renderDashboard(); }

function renderSections() {
  const filtered = currentFilter==="전체" ? allItems
    : currentFilter==="즉각반영" ? allItems.filter(i=>i.category==="즉각반영")
    : currentFilter==="참고용" ? allItems.filter(i=>i.category==="참고용")
    : allItems.filter(i=>i.date.startsWith(currentFilter));
  const el = document.getElementById("sections");
  if (el) el.innerHTML =
    renderSection("즉각반영","#EF4444","🔴",filtered.filter(i=>i.category==="즉각반영")) +
    renderSection("참고용","#F59E0B","🟡",filtered.filter(i=>i.category==="참고용"));
  document.querySelectorAll(".scroll-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const t = document.getElementById(btn.dataset.target);
      if (t) t.scrollBy({ left: btn.dataset.dir==="1"?280:-280, behavior:"smooth" });
    });
  });
}

function renderSection(title, color, icon, items) {
  const id = "scroll-"+title;
  return `<div class="section">
    <div class="section-header">
      <span>${icon}</span>
      <span class="section-title" style="color:${color}">${title}</span>
      <span class="section-count">${items.length}개</span>
      <div class="spacer"></div>
      <button class="scroll-btn" data-target="${id}" data-dir="-1">◀</button>
      <button class="scroll-btn" data-target="${id}" data-dir="1">▶</button>
    </div>
    <div class="cards" id="${id}">
      ${items.length===0?'<div class="empty">항목 없음</div>':items.map(renderCard).join("")}
    </div>
  </div>`;
}

function renderCard(item) {
  const tags = item.projects.map(p=>{
    const c=PROJECT_COLORS[p]||{bg:"#1F2937",text:"#9CA3AF",border:"#374151"};
    return `<span class="tag" style="background:${c.bg};color:${c.text};border:1px solid ${c.border}">${p}</span>`;
  }).join("");
  return `<div class="${item.done?'card done':'card'}">
    <div class="card-title" title="${item.title.replace(/"/g,'&quot;')}">${item.title}</div>
    <div class="card-meta">${item.channel} · ${item.date}</div>
    <div class="card-tags">${tags}</div>
    <div class="card-footer">
      <label><input type="checkbox" ${item.done?'checked':''} style="accent-color:#10B981"> ${item.done?'반영완료 ✓':'반영완료'}</label>
      ${item.link?`<a href="${item.link}" target="_blank">▶ 보기</a>`:''}
    </div>
  </div>`;
}

const saved = getToken();
if (saved) { fetchData(); } else { renderTokenScreen(); }
</script>
</body>
</html>
